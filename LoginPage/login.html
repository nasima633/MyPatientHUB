<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>MyPatientHUB</title>
    <link rel="icon" href="assets/icon/favicon.ico" />
    <link rel="stylesheet" href="login.css" />
    <script src="login.js" defer></script>
  </head>

  <body>
    <main>
      <h1 class="login-title">Welcome To MyPatientHUB!</h1>

      <p class="login-subtitle">
        We provide smart healthcare service in your hands.
      </p>

      <div class="login-form">
        <form action="#" class="form-info" id="forminfo">
          <p class="login-form-title">Sign in to MyPatientHUB</p>

          <div class="social-login">
            <button type="button" class="social-btn">
              <img src="../assets/icon/facebook.png" alt="Sign in with Facebook" width="100" hight="100" />
            </button>

            <button type="button" class="social-btn">
              <img src="../assets/icon/google.png" alt="Sign in with Google" />
            </button>
          </div>

          <input
            type="text"
            placeholder="Email or Phone number"
            required
            class="email-holder"
            id="emailorphone"
          />

          <input
            type="password"
            placeholder="Password"
            required
            class="password-holder"
            id="password"
          />

          <button type="submit" class="sign-in-btn" id="signin-btn">
            SIGN IN
          </button>

          <a href="#" class="forget-password"> Forgot Password? </a>

          <label class="remember-me">
            <input type="checkbox" class="remember-check" />
            <span class="remember-text">Remember Me</span>
          </label>

          <p class="space-in-up">or</p>

          <button type="button" class="sign-up-btn" id="signup-btn">
            SIGN UP
          </button>
        </form>
      </div>
    </main>

    <footer class="login-footer">
      <ul class="footer-list">
        <li>
          <a href="#" class="footer-txts"> Google Play Store APP </a>
        </li>

        <li>
          <a href="#" class="footer-txts"> App Store APP </a>
        </li>

        <li>
          <a href="#" class="footer-txts"> About MyPatientHUB </a>
        </li>

        <li>
          <a href="#" class="footer-txts"> About Us </a>
        </li>

        <li>
          <a href="#" class="footer-txts"> Our Blog </a>
        </li>
      </ul>

      <p class="copy-right">Copyright © 2022 MyPiHUB</p>
    </footer>
  </body>
</html>
