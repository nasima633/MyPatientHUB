<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyPatientHUB</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .welcome {
            width: 100%;
            height: 370px;
            background: linear-gradient(rgba(20, 20, 45, 0.15), rgba(20, 20, 45, 0.15)),
                        url("login-background.jpg") center/cover no-repeat;
            color: white;
            text-align: center;
            padding-top: 85px;
        }

        .welcome h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .welcome p {
            font-size: 15px;
        }

        .login-box {
            width: 375px;
            max-width: calc(100% - 30px);
            background: white;
            padding: 26px 20px 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            margin-top: -185px;
            position: relative;
        }

        .login-box h2 {
            text-align: center;
            color: #405066;
            font-size: 19px;
            margin-bottom: 25px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .social-buttons button {
            width: 64px;
            height: 48px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 7px;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
        }

        .facebook {
            color: #4267B2;
        }

        .google {
            color: #4285F4;
        }

        .login-box input[type="text"],
        .login-box input[type="password"] {
            width: 100%;
            height: 35px;
            border: 1px solid #d8dce2;
            border-radius: 6px;
            padding: 0 10px;
            margin-bottom: 13px;
            outline: none;
        }

        .login-box input:focus {
            border-color: #a600c9;
        }

        .sign-in {
            width: 100%;
            height: 35px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(90deg, #ec008c, #a600c9);
            color: white;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 6px;
            font-size: 11px;
            color: #9aa1ad;
        }

        .options a {
            color: #9aa1ad;
            text-decoration: none;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .message {
            text-align: center;
            font-size: 12px;
            min-height: 18px;
            margin-top: 5px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #9aa1ad;
            font-size: 11px;
            margin: 8px 0 18px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .sign-up {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 35px;
            border-radius: 6px;
            background: linear-gradient(90deg, #22b9e8, #2878ef);
            color: white;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
        }

        .footer {
            margin-top: 48px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 0 20px 25px;
        }

        .footer a {
            color: #9aa5b1;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .welcome {
                height: 330px;
                padding-top: 55px;
            }

            .welcome h1 {
                font-size: 29px;
            }

            .welcome p {
                font-size: 13px;
            }

            .login-box {
                margin-top: -170px;
            }

            .footer {
                margin-top: 40px;
                gap: 15px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <section class="welcome">
            <h1>Welcome to MyPatientHUB!</h1>
            <p>We provide smart healthcare services in your hands.</p>
        </section>

        <section class="login-box">
            <h2>Sign in to MyPatientHUB</h2>

            <div class="social-buttons">
                <button type="button" class="facebook">f</button>
                <button type="button" class="google">G</button>
            </div>

            <form id="loginForm">

                <input
                    type="text"
                    id="email"
                    placeholder="Email or Phone number"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Please enter your password"
                    required
                >

                <button type="submit" class="sign-in">SIGN IN</button>

                <div class="options">
                    <a href="#">Forgot password?</a>

                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>
                </div>

                <div id="message" class="message"></div>

                <div class="divider">
                    <span>or</span>
                </div>

                <a href="#" class="sign-up">SIGN UP</a>

            </form>
        </section>

        <footer class="footer">
            <a href="#">Google Play Store APP</a>
            <a href="#">App Store APP</a>
            <a href="#">About MyPatientHUB</a>
            <a href="#">About Us</a>
            <a href="#">Our Blog</a>
        </footer>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            
            if (email === "project@gmail.com" && password === "123456") {

                message.textContent = "Login successful...";
                message.style.color = "green";

            // it redirects us to the index.html page
                window.location.href = "index.html";

            } else {

                message.textContent = "Incorrect email or password.";
                message.style.color = "red";
            }
        });
    </script>

</body>
</html>
